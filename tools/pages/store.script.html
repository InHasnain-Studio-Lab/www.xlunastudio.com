<script>
(function () {
  // The first apps headed for the Microsoft Store. Every claim matches the app's own listing and privacy page.
  const APPS = [
    { slug: "xluna-os", name: "XLUNA OS", kind: "Desktop shell", tagline: "Your desktop, lit by the moon.",
      brief: "A moonlit desktop for Windows: live 3D wallpapers that move with your PC, an App Hub for every app, a dock with live window previews and widgets that report the real numbers.",
      overview: "Want a desktop that feels alive instead of a flat picture, and to see what your PC is doing without opening a single tool? XLUNA OS turns your screen into a moonlit desk: live wallpapers that move with your processor, memory and network, a dock for every app and window, and widgets that report the real numbers.",
      tags: ["Desktop shell", "Live wallpapers", "App Hub", "Widgets"],
      highlights: ["Live 3D wallpapers, from a NASA-mapped Moon to Saturn, that move with your PC", "App Hub with every desktop and Microsoft Store app, pin any in a click", "A dock with pinned apps, every open window and live previews", "Clocks, system gauges, a 7-day forecast, media and notes", "Frosted Glass or Moonlight Glass in five luminous inks", "Command palette, focus countdown, Zen mode and screen capture"],
      shots: ["The XLUNA OS particle wallpaper with widgets and the dock", "The App Hub over a live wallpaper", "The 3D Moon wallpaper with the control centre", "About, with the licence and integrity badges"],
      net: "Two requests only: the Microsoft Store licence check and the weather forecast for the city you choose." },
    { slug: "xfidelity-ultra", name: "XFidelity Ultra", kind: "Audio enhancer", tagline: "Make everything you play sound bigger.",
      brief: "One power button and every app your PC plays sounds wider, deeper and clearer, from the speakers or headphones you already own.",
      overview: "Want cinema sound from your PC without buying new gear, or headphone audio that stops sitting flat inside your head? XFidelity Ultra answers both with one press of the power button: every app you play sounds wider, deeper and clearer, processed live on your own PC.",
      tags: ["Audio", "Surround", "8D", "Equalizer"],
      highlights: ["Every app Windows plays is enhanced automatically", "Fifteen experiences: Cinema, Surround, Orbit 8D, Hyper 3D, Bass Titan and more", "Dialogue brought forward with Vocal Focus and Crystal Air", "Intensity, Bass, Width, Space and Clarity controls", "Ten band equalizer and an adjustable limiter", "Hear the original to compare at the same loudness"],
      shots: ["The Surround experience with the live reactor and spectrum", "Settings, with output device, glass mode and inks", "Help and tips", "About, with the licence and integrity details"],
      net: "One request only: the Microsoft Store licence check. Your audio is never recorded or sent anywhere." }
  ];
  const $ = id => document.getElementById(id);

  const launches = $("launches");
  APPS.forEach((a, k) => {
    const card = document.createElement("article");
    card.className = "launch";
    card.innerHTML = `<button type="button" class="launch-shot" aria-label="View ${a.name} details"><img src="/assets/apps/${a.slug}/hero.jpg" alt="${a.name} promotional artwork" loading="lazy" width="1920" height="1080"></button>
      <div class="launch-body">
        <div class="launch-id"><img src="/assets/apps/${a.slug}/icon.png" alt="" width="56" height="56"><div><span class="eyebrow">${a.kind}</span><h3>${a.name}</h3></div><span class="soon">Coming soon</span></div>
        <p class="launch-tag">${a.tagline}</p>
        <p>${a.brief}</p>
        <ul class="slot-tags">${a.tags.map(t => `<li>${t}</li>`).join("")}</ul>
        <div class="cta"><button class="btn primary" type="button">View app details</button><a class="btn ghost" href="/privacy/${a.slug}">Privacy</a></div>
      </div>`;
    card.querySelector(".launch-shot").onclick = () => openApp(k);
    card.querySelector(".btn.primary").onclick = () => openApp(k);
    launches.appendChild(card);
  });

  const dossier = $("dossier");
  // Lifted out of <main>, whose stacking layer sits under the sticky header, so the dialog covers the whole page.
  document.body.appendChild(dossier);
  let lastFocus = null;
  function selectTab(name) {
    document.querySelectorAll("#d-tabs [role=tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === name));
    document.querySelectorAll("[data-panel]").forEach(p => p.hidden = p.dataset.panel !== name);
  }
  document.querySelectorAll("#d-tabs [role=tab]").forEach(b => b.onclick = () => selectTab(b.dataset.tab));

  function openApp(k) {
    const a = APPS[k];
    lastFocus = document.activeElement;
    $("d-icon").src = `/assets/apps/${a.slug}/icon.png`;
    $("d-hero").src = `/assets/apps/${a.slug}/hero.jpg`;
    $("d-hero").alt = `${a.name} promotional artwork`;
    $("d-kind").textContent = a.kind;
    $("d-title").textContent = a.name;
    $("d-brief").textContent = a.brief;
    $("d-overview").textContent = a.overview;
    $("d-frames").innerHTML = a.shots.map((cap, i) => `<a class="frame shot" href="/assets/apps/${a.slug}/shot-${i + 1}.jpg" target="_blank" rel="noopener"><img src="/assets/apps/${a.slug}/shot-${i + 1}.jpg" alt="${cap}" loading="lazy"><span class="coord">${cap}</span></a>`).join("");
    $("d-highlights").innerHTML = a.highlights.map(h => `<li>${h}</li>`).join("");
    $("d-des").textContent = `${a.name}, ${a.kind.toLowerCase()} for Windows`;
    $("d-net").textContent = a.net;
    $("d-privnote").innerHTML = `Read the full <a href="/privacy/${a.slug}">${a.name} privacy policy</a>.`;
    $("d-alert").href = `mailto:contact@xlunastudio.com?subject=${encodeURIComponent(`Launch alert: ${a.name}`)}&body=${encodeURIComponent(`Please tell me when ${a.name} launches on the Microsoft Store.`)}`;
    selectTab("overview");
    dossier.hidden = false;
    $("d-close").focus();
  }
  function closeDossier() { dossier.hidden = true; lastFocus && lastFocus.focus(); }
  $("d-close").onclick = closeDossier;
  dossier.addEventListener("click", e => { if (e.target === dossier) closeDossier(); });
  addEventListener("keydown", e => { if (e.key === "Escape" && !dossier.hidden) closeDossier(); });

  const linked = APPS.findIndex(a => `#${a.slug}` === location.hash);
  if (linked >= 0) openApp(linked);
})();
</script>
