<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 128 128" width="128" height="128">
  <title>XLUNA mark</title>
  <defs>
    <radialGradient id="disc" cx="38%" cy="34%" r="74%">
      <stop offset="0" stop-color="#25324a"/>
      <stop offset="0.55" stop-color="#111a2b"/>
      <stop offset="1" stop-color="#05080f"/>
    </radialGradient>
    <radialGradient id="earthshine" cx="30%" cy="30%" r="60%">
      <stop offset="0" stop-color="#8fe6ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8fe6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.45" stop-color="#8fe6ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8fe6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d6f6ff"/>
      <stop offset="1" stop-color="#8fe6ff"/>
    </linearGradient>
    <linearGradient id="ringFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fe6ff"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8fe6ff"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#c9d0dc" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8fe6ff" stop-opacity="0.5"/>
    </linearGradient>
    <mask id="crescent"><circle cx="60" cy="60" r="34" fill="#fff"/><circle cx="53.5" cy="55.5" r="33" fill="#000"/></mask>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <circle cx="60" cy="60" r="52" fill="url(#halo)"/>
  <path transform="translate(60 60) rotate(-34)" d="M-55 0 A55 12 0 0 1 55 0" fill="none" stroke="#8fe6ff" stroke-opacity="0.42" stroke-width="3.6" stroke-linecap="round" filter="url(#glow)"/>
  <path transform="translate(60 60) rotate(34)" d="M-55 0 A55 12 0 0 1 55 0" fill="none" stroke="#8fe6ff" stroke-opacity="0.42" stroke-width="3.6" stroke-linecap="round" filter="url(#glow)"/>

  <circle cx="60" cy="60" r="34" fill="url(#disc)"/>
  <circle cx="60" cy="60" r="34" fill="url(#earthshine)"/>
  <circle cx="60" cy="60" r="34" fill="url(#lit)" mask="url(#crescent)" filter="url(#soft)" opacity="0.75"/>
  <circle cx="60" cy="60" r="34" fill="url(#lit)" mask="url(#crescent)"/>
  <circle cx="60" cy="60" r="33.5" fill="none" stroke="url(#rim)" stroke-width="1"/>

  <path transform="translate(60 60) rotate(-34)" d="M-55 0 A55 12 0 0 0 55 0" fill="none" stroke="url(#ringFront)" stroke-width="3.6" stroke-linecap="round" filter="url(#glow)"/>
  <path transform="translate(60 60) rotate(34)" d="M-55 0 A55 12 0 0 0 55 0" fill="none" stroke="url(#ringFront)" stroke-width="3.6" stroke-linecap="round" filter="url(#glow)"/>
  <path transform="translate(60 60) rotate(-34)" d="M-40 8.2 A55 12 0 0 0 -8 11.9" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.9"/>
  <path transform="translate(60 60) rotate(34)" d="M8 11.9 A55 12 0 0 0 40 8.2" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.9"/>
</svg>
