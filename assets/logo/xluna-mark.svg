      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.56  0 0 0 0 0.9  0 0 0 0 1  0 0 0 0.75 0" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g mask="url(#gap)" filter="url(#glow)"><path d="M110 10 L64 52 L14 106 Q12 108 10 110 L56 68 L106 14 Q108 12 110 10 Z" fill="url(#blade)"/></g>
  <circle cx="60" cy="60" r="44" fill="url(#moonlit)" mask="url(#crescent)" filter="url(#glow)"/>
</svg>