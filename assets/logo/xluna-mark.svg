<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 128 128" width="128" height="128">
  <title>XLUNA mark</title>
  <defs>
    <linearGradient id="moonlit" x1="0.15" y1="0.1" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#e2f8ff"/><stop offset="1" stop-color="#8fe6ff"/>
    </linearGradient>
    <linearGradient id="blade" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6f6ff"/><stop offset="0.5" stop-color="#8fe6ff"/><stop offset="1" stop-color="#5cc8f0"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="60" cy="60" r="52" fill="#fff"/>
      <circle cx="67" cy="53" r="50.5" fill="#000"/>
    </mask>
    <mask id="gap">
      <rect x="-10" y="-10" width="140" height="140" fill="#fff"/>
      <g mask="url(#crescentWide)"><circle cx="60" cy="60" r="56" fill="#000"/></g>
    </mask>
    <mask id="crescentWide">
      <circle cx="60" cy="60" r="56" fill="#fff"/>
      <circle cx="67" cy="53" r="46" fill="#000"/>
    </mask>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.56  0 0 0 0 0.9  0 0 0 0 1  0 0 0 0.75 0" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g mask="url(#gap)" filter="url(#glow)"><path d="M118 2 L65 52 L8 112 Q5 115 2 118 L55 68 L112 8 Q115 5 118 2 Z" fill="url(#blade)"/></g>
  <circle cx="60" cy="60" r="52" fill="url(#moonlit)" mask="url(#crescent)" filter="url(#glow)"/>
</svg>