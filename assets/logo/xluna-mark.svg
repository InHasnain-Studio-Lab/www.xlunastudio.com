<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 132 132" width="132" height="132">
  <title>XLUNA mark</title>
  <defs>
    <linearGradient id="moonlit" x1="0.15" y1="0.1" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#e2f8ff"/><stop offset="1" stop-color="#8fe6ff"/>
    </linearGradient>
    <linearGradient id="blade" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6f6ff"/><stop offset="0.5" stop-color="#8fe6ff"/><stop offset="1" stop-color="#5cc8f0"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="60" cy="60" r="44" fill="#fff"/>
      <circle cx="74" cy="46" r="41" fill="#000"/>
    </mask>
    <mask id="gap">
      <rect x="-10" y="-10" width="140" height="140" fill="#fff"/>
      <g mask="url(#crescentWide)"><circle cx="60" cy="60" r="48" fill="#000"/></g>
    </mask>
    <mask id="crescentWide">
      <circle cx="60" cy="60" r="48" fill="#fff"/>
